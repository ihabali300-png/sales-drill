plugins { id 'com.android.application' }
android {
    namespace 'com.ihab.salesdrill'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ihab.salesdrill'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }
    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'salesdrill'
            keyAlias 'sd'
            keyPassword 'salesdrill'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
