name: Build APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/**']
  workflow_dispatch:
concurrency:
  group: apk
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk SalesDrill.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: تمارين البيع APK ${{ github.run_number }}
          files: SalesDrill.apk
          make_latest: true
